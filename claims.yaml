- id: navarrete
  kind: source
  evidence:
    citation_id: navarrete2011
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1038/nature10629; PubMed abstract: controlling for fat-free body mass,
      brain size is not negatively correlated with digestive-tract mass in 100 mammalian species including
      23 primates (the text previously said across primates).'
  passage: The strict brain-versus-gut trade-off has also been weakened by work finding no simple inverse
    relation between brain size and digestive-tissue mass across mammals, primates included [@navarrete2011].
- id: arespect-def
  kind: definition
  rationale: Introduces the central term; the definition is stipulative and distinguished from disrespect
    and ingratitude in Section 2.
  passage: 'We call it arespect: the absence of felt regard for inherited difficulty, where the difficulty
    has ceased to be perceived at all, so that no weighing or dismissal takes place.'
- id: arespect-disposition
  kind: definition
  rationale: Fixes the concept as a standing disposition, not a momentary failure of attention.
  passage: 'Arespect is a disposition and not a lapse: the claim concerns a person''s standing relation
    of unfelt reliance on the grid, and a single failure to notice the grid on a given morning would not
    qualify.'
- id: stack-blindness-def
  kind: definition
  rationale: Names the mechanism, the withdrawal of a working layer from view.
  passage: The condition is arespectfulness, and its mechanism, the withdrawal of a working layer from
    view, is stack blindness.
- id: transition-claim
  kind: interpretation
  rationale: 'The distinctness claim: the comparison table shows each adjacent concept names mechanism
    or content, not the failure of regard.'
  passage: The new term names that transition alone.
- id: structural-claim
  kind: interpretation
  rationale: Holds on the established layers alone; the contested propositions carry no load, as the evidence
    table states.
  passage: The structural claim, that inherited difficulty drops from perception because of the success
    of what drops, rests only on the established layers.
- id: enabling-not-constitutive
  kind: interpretation
  rationale: Limits the bioenergetic claim to enabling conditions and declines the constitutive claim.
  passage: The defensible claim is limited.
- id: no-oxygen-catastrophe
  kind: interpretation
  rationale: Evidential limit on the Great Oxidation Event; the microbial record cannot support a documented
    die-off.
  passage: There is no direct evidence for a discrete mass extinction of anaerobes, an "oxygen catastrophe"
    in the sense of a documented die-off, and the microbial record of the period is too sparse to support
    such a claim.
- id: remedy
  kind: normative
  rationale: 'Normative recommendation of the paper: regard for inherited depth, cultivated deliberately,
    without abandoning fluent use.'
  passage: 'What remains is depth perception: continuing to act fluently through the stack while keeping
    its depth in view, in the literal sense of *respicere*.'
