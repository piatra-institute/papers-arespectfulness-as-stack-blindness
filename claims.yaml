- id: brain-energy
  kind: source
  evidence:
    citation_id: raichle2002
    locator: Opening paragraph
    verified: true
    verification_note: 'DOI 10.1073/pnas.172399499; PMC full text (PMC124895): the brain is about 2% of
      body weight and accounts for about 20% of oxygen and calories consumed, a rate remarkably constant
      despite varying mental activity.'
  passage: The brain is about 2% of body mass and consumes on the order of 20% of the body's resting energy,
    a share that changes little between demanding tasks and rest [@raichle2002].
- id: wonderwerk
  kind: source
  evidence:
    citation_id: berna2012
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1073/pnas.1117620109; Crossref abstract: burned bone and ashed plant remains
      at Wonderwerk Cave, approximately 1.0 Ma.'
  passage: Secure traces of controlled fire are old but sparse, with burned bone and ashed plant remains
    at Wonderwerk Cave near 1 million years ago and a hearth-bearing site at Gesher Benot Ya'aqov around
    790,000 years ago [@berna2012; @goreninbar2004], yet evidence for *habitual* fire, reliable enough
    to sustain an evolutionary dependency, becomes continuous only around 400,000 to 300,000 years ago,
    later than the hypothesis requires [@roebroeks2011].
