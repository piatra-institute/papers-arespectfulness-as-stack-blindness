abstract: |-
  Modern agents act atop layered inheritances they did not build and cannot fully perceive: the oxygenated atmosphere, the mitochondrial machinery that powers a thought, controlled fire, written memory, the compiler that turns code into machine behavior. This paper develops a concept for the failure these inheritances produce. Arespect is not disrespect, which perceives a value and diminishes it, and not ingratitude, which withholds feeling toward a recognized debt. Arespect is the failure to perceive the depth, cost, and difficulty of an enabling condition at all, the blankness that settles once a hard-won achievement stabilizes into a reliable interface. Its mechanism is stack blindness: a working layer withdraws from attention because we act through it rather than toward it, and returns to view only when it breaks. The argument distinguishes arespect from a family of neighboring concepts (disenchantment, reification, alienation, inattentional blindness, the withdrawal of the ready-to-hand, infrastructural invisibility, black-boxing, tacit knowing), each of which names the mechanism or the content of recession while none names the dispositional failure of regard that recession makes possible. It then traces the stack across scales, from the geological inheritance of breathable oxygen and the cellular inheritance of mitochondrial energy through fire, writing, and software, holding every empirical claim to a discipline that separates established science from plausible inference, live controversy, and speculation. The cure proposed is not gratitude but depth perception, including honest perception of how much of the depth remains unknown. Civilization is read as accumulated impossibility rendered usable, and arespect as the price of the rendering.
