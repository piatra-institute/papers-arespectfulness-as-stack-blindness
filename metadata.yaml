abstract: 'Modern agents act through inheritances they did not build and seldom perceive: an oxygenated
  atmosphere produced by cyanobacteria, the mitochondrial machinery that supplies neural energy, controlled
  fire, written memory, and the compilers that turn source code into machine behavior. We name the resulting
  failure of perception arespect: the absence of felt regard for the depth, cost, and difficulty of an
  enabling condition, which settles once a hard-won achievement stabilizes into a reliable interface.
  Arespect differs from disrespect and from ingratitude, both of which presuppose that the thing has been
  perceived. Its mechanism, stack blindness, is the withdrawal of a working layer from attention while
  the agent acts through it; the layer returns to view when it fails. A comparison with disenchantment
  (Weber), reification (Lukács), alienation, inattentional and change blindness, the withdrawal of the
  ready-to-hand (Heidegger), infrastructural invisibility (Star), black-boxing (Latour), and tacit knowing
  (Polanyi) shows that each describes the mechanism or the content of withdrawal, and none describes the
  dispositional failure of regard that withdrawal permits. The stack is then traced across scales, from
  the Great Oxidation Event around 2.4 to 2.3 billion years ago and the endosymbiotic origin of mitochondria,
  through the brain''s consumption of about 20% of resting energy, to fire, writing, and software abstraction,
  with each empirical claim graded as established, plausible inference, or live controversy. The structural
  claim, that inherited difficulty drops from perception because of the success of what drops, rests only
  on the established layers. The proposed remedy is depth perception, including an accurate estimate of
  how much of the depth remains unknown.'
web_blurb: Arespect is the failure to perceive the cost and difficulty of an inherited enabling condition
  once it becomes a reliable interface. Its mechanism, stack blindness, is traced from atmospheric oxygen
  and mitochondria to fire, writing, and compilers.
